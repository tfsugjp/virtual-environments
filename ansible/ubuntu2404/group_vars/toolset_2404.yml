---
# Single source of truth: images/ubuntu/toolsets/toolset-2404.json
#
# This file is controller-read and parsed; installer downloads are performed by
# the upstream scripts on the target.

# Keep the synchronized toolset in this Ansible directory for controller-side parsing.
_toolset_source_path: "{{ playbook_dir }}/../toolsets/toolset-2404.json"

# Parsed toolset object
# (Use json_query or direct dict access throughout roles.)
toolset: "{{ lookup('file', _toolset_source_path) | from_json }}"
