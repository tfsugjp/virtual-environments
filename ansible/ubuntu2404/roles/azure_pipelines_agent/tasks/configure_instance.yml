---
# =============================================================================
# Configure a single Azure Pipelines Agent instance
# =============================================================================
# Called from main.yml via loop.  Expects:
#   _instance              – dict with at least 'name', optionally 'pool'
#   _azp_resolved_version  – target version string
#   _azp_tarball_path      – path to downloaded tarball
#   All azp_* defaults

- name: "{{ _instance.name }} | Set instance variables"
  ansible.builtin.set_fact:
    _inst_dir: "{{ azp_agent_base_dir }}/{{ _instance.name }}"
    _inst_pool: >-
      {{
        azp_pool_runtime_override
        if (azp_pool_runtime_override | default('') | length > 0)
        else (_instance.pool | default(azp_pool))
      }}
    _inst_service_script: "{{ azp_agent_base_dir }}/{{ _instance.name }}/svc.sh"
    _inst_agent_file: "{{ azp_agent_base_dir }}/{{ _instance.name }}/.agent"
    _inst_version_marker: "{{ azp_agent_base_dir }}/{{ _instance.name }}/.ansible_agent_version"

# ---- Check current state ------------------------------------------------

- name: "{{ _instance.name }} | Check for existing .agent file"
  ansible.builtin.stat:
    path: "{{ _inst_agent_file }}"
  register: _inst_agent_stat

- name: "{{ _instance.name }} | Check for the Ansible version marker"
  ansible.builtin.stat:
    path: "{{ _inst_version_marker }}"
  register: _inst_version_marker_stat

- name: "{{ _instance.name }} | Read Ansible version marker"
  ansible.builtin.slurp:
    src: "{{ _inst_version_marker }}"
  register: _inst_version_marker_content
  when: _inst_version_marker_stat.stat.exists | default(false)

- name: "{{ _instance.name }} | Check for the installed agent listener"
  ansible.builtin.stat:
    path: "{{ _inst_dir }}/bin/Agent.Listener"
  register: _inst_listener_stat

- name: "{{ _instance.name }} | Read installed agent version"
  ansible.builtin.command:
    argv:
      - "{{ _inst_dir }}/bin/Agent.Listener"
      - --version
  become: true
  become_user: "{{ azp_agent_user }}"
  register: _inst_listener_version
  changed_when: false
  check_mode: false
  when:
    - _inst_agent_stat.stat.exists | default(false)
    - not (_inst_version_marker_stat.stat.exists | default(false))
    - _inst_listener_stat.stat.exists | default(false)

- name: "{{ _instance.name }} | Set current agent version"
  ansible.builtin.set_fact:
    _inst_current_version: >-
      {{
        (_inst_version_marker_content.content | b64decode | trim)
        if (
          (_inst_version_marker_stat.stat.exists | default(false))
          and (_inst_listener_stat.stat.exists | default(false))
        )
        else (_inst_listener_version.stdout | trim)
        if (_inst_listener_stat.stat.exists | default(false))
        else ''
      }}

- name: "{{ _instance.name }} | Determine if install/update is needed"
  ansible.builtin.set_fact:
    _inst_needs_update: >-
      {{
        (azp_force_reinstall | default(false) | bool)
        or (_inst_current_version != _azp_resolved_version)
      }}

- name: "{{ _instance.name }} | Display version comparison"
  ansible.builtin.debug:
    msg: >-
      Instance '{{ _instance.name }}':
      current={{ _inst_current_version | default('(none)') }},
      target={{ _azp_resolved_version }},
      pool={{ _inst_pool }},
      force_reinstall={{ azp_force_reinstall | default(false) | bool }},
      action={{
        'force reinstall' if (azp_force_reinstall | default(false) | bool)
        else ('install/update' if (_inst_needs_update | bool) else 'skip (up-to-date)')
      }}

# ---- Skip if already at target version ----------------------------------

- name: "{{ _instance.name }} | Install or update agent"
  when: _inst_needs_update | bool
  block:
    - name: "{{ _instance.name }} | Validate credentials before installation or update"
      ansible.builtin.assert:
        that:
          - azp_url is defined and azp_url | length > 0
          - azp_client_id is defined and azp_client_id | length > 0
          - azp_tenant_id is defined and azp_tenant_id | length > 0
          - azp_client_secret is defined and azp_client_secret | length > 0
        fail_msg: >-
          Agent installation or update requires azp_url, azp_client_id,
          azp_tenant_id, and azp_client_secret. Provide them through Ansible
          Vault or the playbook runtime environment.
        quiet: true

    # ---- Stop existing service (update path) ---------------------------

    - name: "{{ _instance.name }} | Check if svc.sh exists"
      ansible.builtin.stat:
        path: "{{ _inst_service_script }}"
      register: _inst_svc_stat

    - name: "{{ _instance.name }} | Stop agent service (update)"
      ansible.builtin.shell: |
        cd {{ _inst_dir }}
        ./svc.sh stop
      become: true
      when:
        - _inst_agent_stat.stat.exists | default(false)
        - _inst_svc_stat.stat.exists | default(false)
      changed_when: true

    - name: "{{ _instance.name }} | Uninstall agent service (update)"
      ansible.builtin.shell: |
        cd {{ _inst_dir }}
        ./svc.sh uninstall
      become: true
      when:
        - _inst_agent_stat.stat.exists | default(false)
        - _inst_svc_stat.stat.exists | default(false)
      changed_when: true

    - name: "{{ _instance.name }} | Unconfigure existing agent (update)"
      ansible.builtin.shell: |
        cd {{ _inst_dir }}
        ./config.sh remove \
          --auth {{ azp_auth_type | quote }} \
          --clientid {{ azp_client_id | quote }} \
          --tenantid {{ azp_tenant_id | quote }} \
          --clientsecret {{ azp_client_secret | quote }}
      become: true
      become_user: "{{ azp_agent_user }}"
      no_log: "{{ azp_no_log_sensitive | default(true) | bool }}"
      when:
        - _inst_agent_stat.stat.exists | default(false)
      changed_when: true
      failed_when: false   # Best-effort removal; fresh install will follow

    # ---- Create user & directory ---------------------------------------

    - name: "{{ _instance.name }} | Create agent system user"
      ansible.builtin.user:
        name: "{{ azp_agent_user }}"
        system: true
        create_home: true
        home: "/home/{{ azp_agent_user }}"
        shell: /bin/bash
        state: present
      become: true

    - name: "{{ _instance.name }} | Add agent user to docker group"
      ansible.builtin.user:
        name: "{{ azp_agent_user }}"
        groups: docker
        append: true
      become: true
      failed_when: false   # docker group may not exist yet

    - name: "{{ _instance.name }} | Create instance directory"
      ansible.builtin.file:
        path: "{{ _inst_dir }}"
        state: directory
        owner: "{{ azp_agent_user }}"
        group: "{{ azp_agent_user }}"
        mode: '0755'
      become: true

    # ---- Extract tarball -----------------------------------------------

    - name: "{{ _instance.name }} | Extract agent tarball"
      ansible.builtin.unarchive:
        src: "{{ _azp_tarball_path }}"
        dest: "{{ _inst_dir }}"
        remote_src: true
        owner: "{{ azp_agent_user }}"
        group: "{{ azp_agent_user }}"
        extra_opts:
          - "--no-same-owner"
      become: true
      when: not ansible_check_mode

    # ---- Configure agent -----------------------------------------------

    - name: "{{ _instance.name }} | Run config.sh"
      ansible.builtin.shell: |
        cd {{ _inst_dir }}
        ./config.sh --unattended \
          --url {{ azp_url | quote }} \
          --auth {{ azp_auth_type | quote }} \
          --clientid {{ azp_client_id | quote }} \
          --tenantid {{ azp_tenant_id | quote }} \
          --clientsecret {{ azp_client_secret | quote }} \
          --pool {{ _inst_pool | quote }} \
          --agent {{ _instance.name | quote }} \
          --work {{ azp_agent_work_dir | quote }} \
          --acceptTeeEula \
          {{ '--replace' if (azp_replace_existing | bool) else '' }}
      become: true
      become_user: "{{ azp_agent_user }}"
      no_log: "{{ azp_no_log_sensitive | default(true) | bool }}"
      changed_when: true

    # ---- Install and start systemd service ----------------------------

    - name: "{{ _instance.name }} | Install agent as systemd service"
      ansible.builtin.shell: |
        cd {{ _inst_dir }}
        ./svc.sh install {{ azp_agent_user }}
      become: true
      changed_when: true

    - name: "{{ _instance.name }} | Start agent service"
      ansible.builtin.shell: |
        cd {{ _inst_dir }}
        ./svc.sh start
      become: true
      changed_when: true

    # ---- Write version marker ------------------------------------------

    - name: "{{ _instance.name }} | Write version marker"
      ansible.builtin.copy:
        content: "{{ _azp_resolved_version }}"
        dest: "{{ _inst_version_marker }}"
        owner: "{{ azp_agent_user }}"
        group: "{{ azp_agent_user }}"
        mode: '0644'
      become: true

# ---- Verify service status (always) -----------------------------------

- name: "{{ _instance.name }} | Verify agent service status"
  ansible.builtin.shell: |
    cd {{ _inst_dir }}
    ./svc.sh status
  become: true
  register: _inst_svc_status
  changed_when: false
  failed_when: _inst_svc_status.rc != 0

- name: "{{ _instance.name }} | Display service status"
  ansible.builtin.debug:
    msg: "{{ _inst_svc_status.stdout_lines | default(['Service status unknown']) }}"
